# Optional end-to-end tests — run manually from the Actions tab (not on every push).
name: E2E

on:
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright blotter workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otcflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d otcflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/otcflow
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/otcflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate -w @otcflow/api
          npm run db:migrate:deploy -w @otcflow/api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
